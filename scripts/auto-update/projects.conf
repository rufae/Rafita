# Proyectos del nodo que auto_update.sh actualiza además de Rafita
# (Rafita no se lista aquí: su flujo especial va en el propio script).
#
# Formato (campos separados por |):
#   nombre|ruta|rama|remoto|activado(si/no)|hook-posterior
#
# - `activado=no` → el script lo salta con nota en el log.
# - Repos PRIVADOS necesitan credencial en el HP. Recomendado: deploy key
#   SSH de solo lectura (GitHub → Settings → Deploy keys) usando la clave
#   pública de /home/server/.ssh/id_ed25519.pub, con el remoto en SSH.
# - `hook-posterior` se ejecuta con `eval` dentro del repo tras el pull
#   (vacío = solo actualizar código; p. ej. "docker compose up -d --build").
#
# Estado actual de los repos del HP:
#   - Rafita      → público  → ya funciona (script principal).
#   - BuenaTierra → privado  → pendiente de deploy key en GitHub; además
#                    tiene cambios locales en el HP que bloquean el pull
#                    (se saltará y avisará hasta que se resuelvan).
#   - CVWEB       → no es repo git en el HP (está desplegado a mano); no
#                    puede auto-actualizarse vía git sin clonarlo antes.

BuenaTierra|~/proyectos/BuenaTierra|main|git@github.com:rufae/BuenaTierra.git|no|
