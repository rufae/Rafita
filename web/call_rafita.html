<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Llamar a Rafita</title>
<link rel="stylesheet" href="tokens.css">
<style>
  :root {
    /* Decorativos propios de la llamada; los colores de texto/marca vienen
       de tokens.css (fuente unica, Fase 3). */
    --bg-1: #070b18;
    --bg-2: #0d1430;
    --glass: rgba(22, 30, 56, 0.62);
    --glass-border: rgba(148, 163, 184, 0.16);
    --user-1: var(--brand-500);
    --user-2: var(--indigo-500);
    --rafita-1: var(--violet-500);
    --rafita-2: #22d3ee;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: var(--danger);
  }
  /* Fase 3.2: la pagina de llamada respeta prefers-color-scheme (antes era
     oscuro fijo por omision). Decision: coherencia de producto con la SPA. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg-1: #e7edf7;
      --bg-2: #d8e2f2;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(15, 23, 42, 0.12);
      --ok: #16a34a;
      --warn: #b45309;
    }
    body {
      background: radial-gradient(1200px 800px at 20% -10%, #ffffff 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    }
    .status { background: rgba(255, 255, 255, 0.65); }
    .ctl { background: rgba(255, 255, 255, 0.7); }
    .ctl.ghost { background: rgba(255, 255, 255, 0.45); }
    .settings input[type="text"] { background: rgba(255, 255, 255, 0.7); }
    .mini { background: rgba(255, 255, 255, 0.6); }
    .transcript { background: rgba(255, 255, 255, 0.6); }
    .log { color: var(--muted); }
    .transcript .tu { color: #0369a1; }
    .transcript .rafita { color: #4f46e5; }
    .orb .core { box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.08) inset, 0 14px 40px rgba(15, 23, 42, 0.18); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #16204a 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 18px; overflow-x: hidden;
  }
  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.28;
    pointer-events: none; z-index: 0; animation: drift 18s ease-in-out infinite alternate;
  }
  .bg-orb.a { width: 380px; height: 380px; background: var(--user-2); top: -120px; left: -100px; }
  .bg-orb.b { width: 420px; height: 420px; background: var(--rafita-1); bottom: -160px; right: -120px; animation-delay: -6s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(40px,30px,0) scale(1.12); } }

  .shell {
    position: relative; z-index: 1;
    width: min(520px, 100%);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 26px 24px 20px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px rgba(2, 6, 23, 0.65), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; justify-content: center; margin-bottom: 4px; }
  .brand h1 { font-size: 26px; letter-spacing: 0.4px; font-weight: 700;
    background: linear-gradient(92deg, var(--user-1), var(--rafita-1));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand .sub { color: var(--muted); font-size: 12px; }

  .stage { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 6vw, 42px); margin: 22px 0 10px; }
  .orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .orb {
    --level: 0;
    width: clamp(96px, 30vw, 132px); height: clamp(96px, 30vw, 132px);
    border-radius: 50%; position: relative; display: grid; place-items: center;
    transition: box-shadow 0.35s ease, opacity 0.35s ease;
  }
  .orb .core {
    width: 100%; height: 100%; border-radius: 50%;
    transform: scale(calc(0.86 + var(--level) * 0.22));
    transition: transform 0.09s linear;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 50% 60%, var(--c1), var(--c2) 72%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 14px 40px rgba(0,0,0,0.45);
  }
  .orb .ring {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--c1); opacity: calc(0.18 + var(--level) * 0.55);
    transform: scale(calc(1 + var(--level) * 0.16));
    transition: transform 0.09s linear, opacity 0.15s linear;
  }
  .orb .pulse {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--c1); opacity: 0; pointer-events: none;
  }
  .orb.active .pulse { animation: pulseRing 1.6s ease-out infinite; }
  @keyframes pulseRing {
    0% { transform: scale(0.96); opacity: 0.55; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .orb.user { --c1: var(--user-1); --c2: var(--user-2); }
  .orb.rafita { --c1: var(--rafita-1); --c2: var(--rafita-2); }
  .orb.idle .core { animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(0.88); } 50% { transform: scale(0.94); } }
  .orb-label { font-size: 12px; color: var(--muted); letter-spacing: 0.6px; text-transform: uppercase; }
  .orb-wrap.talking .orb-label { color: var(--text); }

  .status {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    margin: 6px auto 16px; padding: 9px 18px; width: fit-content; max-width: 100%;
    border-radius: 999px; font-size: 13px; color: var(--muted);
    background: rgba(15, 23, 42, 0.55); border: 1px solid var(--glass-border);
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.listening .dot { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .status.processing .dot { background: var(--warn); box-shadow: 0 0 12px var(--warn); animation: blink 1s infinite; }
  .status.speaking .dot { background: var(--user-1); box-shadow: 0 0 12px var(--user-1); }
  .status.error .dot { background: var(--err); box-shadow: 0 0 12px var(--err); }
  .status.reconnecting .dot { background: var(--warn); box-shadow: 0 0 12px var(--warn); animation: blink 0.7s infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  .controls { display: flex; gap: 10px; justify-content: center; align-items: stretch; flex-wrap: wrap; }
  .ctl {
    border: 1px solid var(--glass-border); background: rgba(30, 41, 59, 0.7);
    color: var(--text); font-size: 14px; font-weight: 600;
    padding: 13px 22px; border-radius: 16px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s;
  }
  .ctl:hover { transform: translateY(-1px); }
  .ctl:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .ctl.primary { background: linear-gradient(135deg, #059669, #10b981); border-color: transparent; box-shadow: 0 10px 30px rgba(16,185,129,0.25); }
  .ctl.hangup { background: linear-gradient(135deg, #b91c1c, #ef4444); border-color: transparent; box-shadow: 0 10px 30px rgba(239,68,68,0.3); }
  .ctl.stop { background: linear-gradient(135deg, #7c3aed, #a855f7); border-color: transparent; }
  .ctl.ghost { background: rgba(30, 41, 59, 0.45); }
  .ctl.pressed { background: linear-gradient(135deg, #065f46, #10b981); }
  .hidden { display: none !important; }

  .settings { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; align-items: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .settings label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .settings input[type="text"] {
    background: rgba(15, 23, 42, 0.7); border: 1px solid var(--glass-border);
    color: var(--text); padding: 7px 11px; border-radius: 10px; font-size: 12px; width: 170px;
  }
  .mini {
    background: rgba(30, 41, 59, 0.6); border: 1px solid var(--glass-border);
    color: var(--muted); padding: 7px 12px; border-radius: 10px; font-size: 12px; cursor: pointer;
  }
  .mini:hover { color: var(--text); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #debugControls { display: inline-flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }

  .transcript {
    display: none; margin-top: 16px; padding: 14px 16px;
    background: rgba(10, 16, 34, 0.6); border: 1px solid var(--glass-border);
    border-radius: 16px; max-height: 190px; overflow-y: auto; font-size: 13px; line-height: 1.5;
  }
  .transcript .tu { color: #7dd3fc; margin-bottom: 3px; }
  .transcript .rafita { color: #c4b5fd; margin-bottom: 11px; }
  .log { color: var(--muted); font-size: 11px; margin-top: 10px; max-height: 84px; overflow-y: auto; padding: 0 4px; }
</style>
</head>
<body>
<div class="bg-orb a"></div>
<div class="bg-orb b"></div>

<main class="shell">
  <div class="brand">
    <h1>Rafita</h1>
    <span class="sub">Llamada de voz · IA local</span>
  </div>

  <section class="stage">
    <div class="orb-wrap" id="userWrap">
      <div class="orb user idle" id="userOrb"><div class="ring"></div><div class="pulse"></div><div class="core"></div></div>
      <span class="orb-label">Tú</span>
    </div>
    <div class="orb-wrap" id="rafitaWrap">
      <div class="orb rafita idle" id="rafitaOrb"><div class="ring"></div><div class="pulse"></div><div class="core"></div></div>
      <span class="orb-label">Rafita</span>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"><span class="dot"></span><span id="statusText">Presiona Iniciar para llamar</span></div>

  <div class="controls">
    <button id="callBtn" class="ctl primary" aria-label="Iniciar llamada" onclick="toggleCall()">📞 Iniciar</button>
    <button id="stopBtn" class="ctl stop hidden" aria-label="Parar de hablar" onclick="stopSpeaking()">⏹ Parar</button>
    <button id="pttBtn" class="ctl ghost" aria-label="Mantener pulsado para hablar" aria-pressed="false" disabled>🎤 Mantener</button>
  </div>

  <div class="settings">
    <label><input type="checkbox" id="vadMode" checked> VAD automático</label>
    <label><input type="checkbox" id="echoCancel" checked> Cancelar eco</label>
    <div id="debugControls" class="hidden">
      <label class="sr-only" for="serverUrl">Servidor (solo depuración)</label>
      <input type="text" id="serverUrl" placeholder="servidor (vacío = este)">
      <button class="mini" onclick="testTTS()">Probar TTS</button>
    </div>
  </div>

  <div id="transcript" class="transcript"></div>
  <div id="log" class="log"></div>
</main>

<script>
// ============================================================
// Rafita Voice Call — cliente (2026-09-27)
// Arreglos: teardown real al colgar, re-llamada sin recargar,
// reproduccion gapless, barge-in por voz + boton Parar, UI con
// dos orbes animados (nivel real de micro y de la voz de Rafita).
// ============================================================

function getApiBase() {
  const custom = document.getElementById('serverUrl').value.trim();
  if (custom) {
    if (custom.startsWith('http')) return custom.replace(/\/$/, '');
    return (window.location.protocol === 'https:' ? 'https://' : 'http://') + custom;
  }
  return window.location.origin;
}
function getWsBase() {
  const custom = document.getElementById('serverUrl').value.trim();
  if (custom) {
    const host = custom.replace(/^https?:\/\//, '').replace(/^wss?:\/\//, '');
    return (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + host;
  }
  return (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host;
}

// Token de sesion (Fase 0.2): NUNCA en query string (queda en el historial
// del navegador y en logs de proxy). Llega por postMessage desde la SPA
// (iframe) o, en acceso directo, por el fragmento #token= (no se envia al
// servidor). Se envia como cabecera X-Call-Token en los fetch y como primer
// mensaje de autenticacion en el WebSocket.
let authToken = '';
(function initAuthToken() {
  const frag = window.location.hash.replace(/^#token=/, '');
  if (frag) {
    try { authToken = decodeURIComponent(frag); } catch (e) { authToken = frag; }
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  window.addEventListener('message', function (ev) {
    if (!ev.data || ev.data.type !== 'rafita-auth' || typeof ev.data.token !== 'string') return;
    // Solo se acepta el token del documento padre (iframe) o del propio origen.
    let parentOrigin = '';
    try {
      parentOrigin = (window.location.ancestorOrigins && window.location.ancestorOrigins[0]) ||
        (document.referrer ? new URL(document.referrer).origin : '');
    } catch (e) {}
    if (parentOrigin && ev.origin !== parentOrigin) return;
    authToken = ev.data.token;
  });
})();
function authHeaders() {
  return authToken ? { 'X-Call-Token': authToken } : {};
}

const STATUS = { IDLE: 'idle', CONNECTING: 'connecting', RECONNECTING: 'reconnecting', LISTENING: 'listening', PROCESSING: 'processing', SPEAKING: 'speaking', ERROR: 'error' };

// Fetch con timeout (Fase 1.3): una peticion colgada no deja la UI muerta.
async function fetchConTimeout(url, opciones, ms) {
  const limite = ms || 10000;
  const ctrl = new AbortController();
  const temporizador = setTimeout(function () { ctrl.abort(); }, limite);
  try {
    return await fetch(url, Object.assign({}, opciones || {}, { signal: ctrl.signal }));
  } catch (e) {
    if (e && e.name === 'AbortError') {
      throw new Error('La petición tardó demasiado (' + Math.round(limite / 1000) + 's). Comprueba la conexión.');
    }
    throw e;
  } finally {
    clearTimeout(temporizador);
  }
}

// AudioWorklet (Fase 1.2): captura de micro fuera del hilo principal. Se carga
// desde un Blob para mantener la pagina como un unico fichero. Si el navegador
// no soporta AudioWorklet se cae al ScriptProcessorNode (deprecado) como
// retrocompatibilidad.
const WORKLET_CODE = [
  'class PcmCapture extends AudioWorkletProcessor {',
  '  process(inputs) {',
  '    const canal = inputs[0] && inputs[0][0];',
  '    if (canal && canal.length) {',
  '      const pcm = new Int16Array(canal.length);',
  '      for (let i = 0; i < canal.length; i++) {',
  '        const s = Math.max(-1, Math.min(1, canal[i]));',
  '        pcm[i] = s < 0 ? s * 32768 : s * 32767;',
  '      }',
  '      this.port.postMessage(pcm.buffer, [pcm.buffer]);',
  '    }',
  '    return true;',
  '  }',
  '}',
  'registerProcessor("pcm-capture", PcmCapture);',
].join('\n');

// Reconexion (Fase 1.1): si el WS cae sin colgar, se reintenta con backoff
// (1s, 2s, 4s; 3 intentos) distinguiendo "reconectando" de "llamada finalizada".
const RECONNECT_MAX = 3;
const RECONNECT_DELAYS = [1000, 2000, 4000];
let intentionalHangup = false;
let reconnectAttempts = 0;
let reconnectTimer = null;

let ws = null, sessionId = null;
let audioContext = null, micStream = null;
let micSource = null, micProcessor = null, micGain = null, micAnalyser = null, micWorklet = null;
let playbackGain = null, rafitaAnalyser = null;
let isCallActive = false, callState = STATUS.IDLE;
let audioQueue = [], activeSources = [], nextPlayTime = 0;
let rafitaTextBuffer = '';
let userLevel = 0, rafitaLevel = 0, targetUserLevel = 0, targetRafitaLevel = 0;

const statusDiv = document.getElementById('status');
const statusText = document.getElementById('statusText');
const logDiv = document.getElementById('log');
const transcriptDiv = document.getElementById('transcript');
const callBtn = document.getElementById('callBtn');
const stopBtn = document.getElementById('stopBtn');
const pttBtn = document.getElementById('pttBtn');
const vadMode = document.getElementById('vadMode');
const echoCancel = document.getElementById('echoCancel');
const userOrb = document.getElementById('userOrb');
const rafitaOrb = document.getElementById('rafitaOrb');
const userWrap = document.getElementById('userWrap');
const rafitaWrap = document.getElementById('rafitaWrap');

function setStatus(state, msg) {
  callState = state;
  statusDiv.className = 'status ' + (state === STATUS.IDLE ? '' : state);
  statusText.textContent = msg;
  const active = state !== STATUS.IDLE && state !== STATUS.ERROR;
  userOrb.classList.toggle('idle', !active || state === STATUS.PROCESSING);
  rafitaOrb.classList.toggle('idle', !active || state !== STATUS.SPEAKING);
  userOrb.classList.toggle('active', state === STATUS.LISTENING);
  rafitaOrb.classList.toggle('active', state === STATUS.SPEAKING);
  stopBtn.classList.toggle('hidden', state !== STATUS.SPEAKING);
}
function log(msg) {
  const t = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.textContent = '[' + t + '] ' + msg;
  logDiv.prepend(div);
}
function addTranscript(role, text) {
  transcriptDiv.style.display = 'block';
  const cls = role === 'tu' ? 'tu' : 'rafita';
  const prefix = role === 'tu' ? 'Tú' : 'Rafita';
  const div = document.createElement('div');
  div.className = cls;
  const strong = document.createElement('strong');
  strong.textContent = prefix + ': ';
  div.append(strong, document.createTextNode(String(text)));
  transcriptDiv.appendChild(div);
  transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
}

// ---------- Audio ----------
async function ensureAudioContext() {
  if (!audioContext || audioContext.state === 'closed') {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    } catch (e) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    playbackGain = audioContext.createGain();
    rafitaAnalyser = audioContext.createAnalyser();
    rafitaAnalyser.fftSize = 1024;
    playbackGain.connect(rafitaAnalyser);
    rafitaAnalyser.connect(audioContext.destination);
  }
  if (audioContext.state === 'suspended') await audioContext.resume();
  return audioContext;
}

function enviarPcm(arrayBuffer) {
  if (!isCallActive || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (pttActive === false && !vadMode.checked) return;
  // El micro NO se silencia mientras Rafita habla: asi el servidor puede
  // detectar barge-in (hablar por encima) y el orbe del usuario se mueve.
  ws.send(arrayBuffer);
}

async function startAudioCapture() {
  if (!micStream || !audioContext) return;
  micSource = audioContext.createMediaStreamSource(micStream);
  micAnalyser = audioContext.createAnalyser();
  micAnalyser.fftSize = 1024;
  micSource.connect(micAnalyser);

  // AudioWorklet (Fase 1.2): fuera del hilo principal y sin el parche del
  // gain a 0. ScriptProcessorNode queda solo como respaldo para navegadores
  // sin AudioWorklet.
  let usadoWorklet = false;
  if (audioContext.audioWorklet) {
    try {
      const blobUrl = URL.createObjectURL(new Blob([WORKLET_CODE], { type: 'application/javascript' }));
      await audioContext.audioWorklet.addModule(blobUrl);
      URL.revokeObjectURL(blobUrl);
      micWorklet = new AudioWorkletNode(audioContext, 'pcm-capture', { numberOfInputs: 1, numberOfOutputs: 1 });
      micWorklet.port.onmessage = function (e) { enviarPcm(e.data); };
      // Salida en silencio (el processor no escribe outputs): mantiene el
      // nodo procesando sin generar feedback audible.
      micWorklet.connect(audioContext.destination);
      micSource.connect(micWorklet);
      usadoWorklet = true;
      log('Captura de audio lista (AudioWorklet, ' + audioContext.sampleRate + ' Hz)');
    } catch (e) {
      log('AudioWorklet no disponible (' + e.message + '); se usa el modo legacy');
    }
  }
  if (!usadoWorklet) {
    micGain = audioContext.createGain();
    micGain.gain.value = 0;
    micProcessor = audioContext.createScriptProcessor(4096, 1, 1);
    micSource.connect(micProcessor);
    micProcessor.connect(micGain);
    micGain.connect(audioContext.destination);
    micProcessor.onaudioprocess = function (e) {
      const input = e.inputBuffer.getChannelData(0);
      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = s < 0 ? s * 32768 : s * 32767;
      }
      enviarPcm(pcm.buffer);
    };
    log('Captura de audio lista (legacy ScriptProcessor, ' + audioContext.sampleRate + ' Hz)');
  }
}

function stopAudioCapture() {
  if (micWorklet) { micWorklet.port.onmessage = null; try { micWorklet.disconnect(); } catch (e) {} micWorklet = null; }
  if (micProcessor) { micProcessor.onaudioprocess = null; try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
  if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
  if (micAnalyser) { try { micAnalyser.disconnect(); } catch (e) {} micAnalyser = null; }
  if (micGain) { try { micGain.disconnect(); } catch (e) {} micGain = null; }
  if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
  targetUserLevel = 0;
}

function stopPlayback() {
  audioQueue = [];
  activeSources.forEach(function (src) { try { src.stop(); } catch (e) {} });
  activeSources = [];
  nextPlayTime = 0;
  targetRafitaLevel = 0;
  rafitaTextBuffer = '';
  if (rafitaWrap) rafitaWrap.classList.remove('talking');
}

async function playChunk(arrayBuffer) {
  if (!audioContext || !isCallActive) return;
  try {
    const audioBuf = await audioContext.decodeAudioData(arrayBuffer.slice(0));
    if (!isCallActive) return;
    const src = audioContext.createBufferSource();
    src.buffer = audioBuf;
    src.connect(playbackGain);
    const startAt = Math.max(nextPlayTime, audioContext.currentTime);
    src.start(startAt);
    nextPlayTime = startAt + audioBuf.duration;
    activeSources.push(src);
    rafitaWrap.classList.add('talking');
    src.onended = function () {
      const idx = activeSources.indexOf(src);
      if (idx >= 0) activeSources.splice(idx, 1);
      if (activeSources.length === 0) {
        targetRafitaLevel = 0;
        rafitaWrap.classList.remove('talking');
      }
    };
  } catch (e) {
    log('Error audio: ' + e.message);
  }
}

function drainQueue() {
  while (audioQueue.length > 0) {
    playChunk(audioQueue.shift());
  }
}

// ---------- Llamada ----------
async function startCall() {
  // Contexto seguro (Fase 0.6): los navegadores solo dan acceso al micro en
  // HTTPS o localhost. En http://<host-de-lan> navigator.mediaDevices no existe.
  if (!window.isSecureContext || !navigator.mediaDevices) {
    setStatus(STATUS.ERROR, 'El micrófono requiere HTTPS: accede por https:// (o desde localhost) o añade un certificado en el proxy.');
    return false;
  }
  setStatus(STATUS.CONNECTING, 'Conectando...');
  stopPlayback();
  intentionalHangup = false;
  reconnectAttempts = 0;
  await ensureAudioContext();

  try {
    const resp = await fetchConTimeout(getApiBase() + '/call/start', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({}),
    }, 10000);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    sessionId = data.session_id;
    log('Sesión: ' + sessionId.slice(0, 8) + '...');
  } catch (e) {
    setStatus(STATUS.ERROR, 'Error al iniciar: ' + e.message);
    return false;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        sampleRate: 16000, channelCount: 1,
        echoCancellation: echoCancel.checked,
        noiseSuppression: true, autoGainControl: true,
      },
    });
  } catch (e) {
    setStatus(STATUS.ERROR, 'Permiso de micrófono denegado');
    return false;
  }

  const ok = await conectarSocket();
  return ok;
}

function conectarSocket() {
  return new Promise(function (resolve) {
    // Sin token en la URL: la autenticacion va en el primer mensaje (Fase 0.2).
    ws = new WebSocket(getWsBase() + '/call/ws/' + sessionId);
    ws.binaryType = 'arraybuffer';
    let resuelto = false;

    ws.onopen = function () {
      resuelto = true;
      log('WebSocket conectado');
      if (authToken) ws.send(JSON.stringify({ type: 'auth', token: authToken }));
      isCallActive = true;
      const rate = audioContext ? audioContext.sampleRate : 48000;
      ws.send(JSON.stringify({ type: 'audio_config', sample_rate: rate }));
      if (!micWorklet && !micProcessor) {
        startAudioCapture().catch(function (e) { log('Captura: ' + e.message); });
      }
      pttBtn.disabled = false;
      setStatus(STATUS.LISTENING, 'Escuchando... habla cuando quieras');
      resolve(true);
    };

    ws.onclose = function () {
      log('WebSocket cerrado');
      if (!resuelto) resolve(false);
      // Fase 1.1: caida inesperada con la llamada activa -> reconectar con
      // backoff; solo el colgado explicito deja la llamada terminada.
      if (!intentionalHangup && isCallActive) programarReconexion();
    };

    ws.onerror = function () {
      if (!resuelto) {
        setStatus(STATUS.ERROR, 'Error de conexión');
        resolve(false);
      }
    };

    ws.onmessage = function (event) {
      if (event.data instanceof ArrayBuffer) {
        audioQueue.push(event.data);
        drainQueue();
      } else {
        try { handleServerMessage(JSON.parse(event.data)); } catch (e) {}
      }
    };
  });
}

function programarReconexion() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (reconnectAttempts >= RECONNECT_MAX) {
    setStatus(STATUS.ERROR, 'No se pudo reconectar (3 intentos). Pulsa Iniciar para volver a llamar.');
    isCallActive = false;
    stopAudioCapture();
    stopPlayback();
    pttBtn.disabled = true;
    callBtn.innerHTML = '\ud83d\udcde Iniciar';
    callBtn.className = 'ctl primary';
    return;
  }
  const espera = RECONNECT_DELAYS[reconnectAttempts];
  reconnectAttempts++;
  setStatus(STATUS.RECONNECTING, 'Conexión perdida. Reconectando (intento ' + reconnectAttempts + '/' + RECONNECT_MAX + ')...');
  reconnectTimer = setTimeout(async function () {
    reconnectTimer = null;
    if (!isCallActive || intentionalHangup) return;
    const ok = await conectarSocket();
    if (ok) {
      reconnectAttempts = 0;
      setStatus(STATUS.LISTENING, 'Reconectado. Te escucho...');
    }
  }, espera);
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'ready':
      break;
    case 'transcribing':
      setStatus(STATUS.PROCESSING, 'Transcribiendo...');
      break;
    case 'transcript':
      if (msg.text) addTranscript('tu', msg.text);
      setStatus(STATUS.PROCESSING, 'Pensando...');
      if (msg.stt_time) log('STT: ' + msg.stt_time.toFixed(1) + 's');
      break;
    case 'thinking':
      setStatus(STATUS.PROCESSING, 'Pensando...');
      rafitaTextBuffer = '';
      break;
    case 'token':
      rafitaTextBuffer += msg.text;
      setStatus(STATUS.SPEAKING, 'Respondiendo...');
      break;
    case 'speaking_fragment':
      setStatus(STATUS.SPEAKING, 'Hablando...');
      break;
    case 'response_text':
      if (msg.text) addTranscript('rafita', msg.text);
      if (msg.llm_time) log('LLM: ' + msg.llm_time.toFixed(1) + 's');
      break;
    case 'latency_report':
      log('STT=' + msg.stt_ms + 'ms LLM=' + msg.llm_ms + 'ms TTS=' + msg.tts_ms +
          'ms PrimerAudio=' + (msg.first_audio_ms != null ? msg.first_audio_ms + 'ms' : 'n/a') +
          ' Total=' + msg.total_ms + 'ms Frag=' + (msg.fragments || 0));
      setStatus(STATUS.LISTENING, 'Escuchando... habla cuando quieras');
      break;
    case 'interrupted':
      stopPlayback();
      setStatus(STATUS.LISTENING, 'Te escucho...');
      log('Respuesta interrumpida (' + (msg.reason || '') + ')');
      break;
    case 'error':
      setStatus(STATUS.ERROR, msg.message);
      break;
    default:
      log('Tipo: ' + msg.type);
  }
}

let pttActive = false;
function pttDown(e) {
  if (!isCallActive) return;
  if (e) e.preventDefault();
  pttActive = true;
  pttBtn.classList.add('pressed');
  pttBtn.setAttribute('aria-pressed', 'true');
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ptt_start' }));
  }
}
function pttUp(e) {
  if (!isCallActive) return;
  if (e) e.preventDefault();
  pttActive = false;
  pttBtn.classList.remove('pressed');
  pttBtn.setAttribute('aria-pressed', 'false');
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'end_speech' }));
  }
}

function stopSpeaking() {
  stopPlayback();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop_speaking' }));
  }
  setStatus(STATUS.LISTENING, 'Te escucho...');
}

async function endCall() {
  stopSpeaking();
  if (sessionId) {
    try { await fetchConTimeout(getApiBase() + '/call/' + sessionId + '/end', { method: 'POST', headers: authHeaders() }, 8000); } catch (e) {}
  }
  sessionId = null;
}

async function toggleCall() {
  if (isCallActive) {
    callBtn.disabled = true;
    intentionalHangup = true;
    isCallActive = false;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    reconnectAttempts = 0;
    stopAudioCapture();
    stopPlayback();
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; }
    await endCall();
    pttBtn.disabled = true;
    callBtn.innerHTML = '📞 Iniciar';
    callBtn.className = 'ctl primary';
    callBtn.setAttribute('aria-label', 'Iniciar llamada');
    setStatus(STATUS.IDLE, 'Llamada finalizada');
    callBtn.disabled = false;
  } else {
    callBtn.disabled = true;
    callBtn.innerHTML = '⏳ Conectando...';
    const ok = await startCall();
    if (ok) {
      callBtn.innerHTML = '📞 Colgar';
      callBtn.className = 'ctl hangup';
      callBtn.setAttribute('aria-label', 'Colgar llamada');
    } else {
      callBtn.innerHTML = '📞 Iniciar';
      callBtn.className = 'ctl primary';
    }
    callBtn.disabled = false;
  }
}

// ---------- Animación de orbes ----------
function rmsFromAnalyser(analyser) {
  if (!analyser) return 0;
  const data = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) {
    const v = (data[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / data.length);
}

function animationLoop() {
  const rawUser = rmsFromAnalyser(micAnalyser);
  const rawRafita = rmsFromAnalyser(rafitaAnalyser);
  const userTarget = isCallActive ? Math.min(1, rawUser * 3.4) : 0;
  const rafitaTarget = Math.min(1, rawRafita * 3.0);
  targetUserLevel += (userTarget - targetUserLevel) * 0.28;
  targetRafitaLevel += (rafitaTarget - targetRafitaLevel) * 0.28;

  const breath = 0.5 + 0.5 * Math.sin(performance.now() / 1300);
  const userShown = Math.max(targetUserLevel, isCallActive ? breath * 0.10 : 0);
  const rafitaShown = Math.max(targetRafitaLevel, callState === STATUS.SPEAKING ? breath * 0.12 : 0);

  userOrb.style.setProperty('--level', userShown.toFixed(3));
  rafitaOrb.style.setProperty('--level', rafitaShown.toFixed(3));
  requestAnimationFrame(animationLoop);
}

// ---------- Eventos ----------
pttBtn.addEventListener('mousedown', pttDown);
pttBtn.addEventListener('mouseup', pttUp);
pttBtn.addEventListener('mouseleave', pttUp);
pttBtn.addEventListener('touchstart', pttDown, { passive: false });
pttBtn.addEventListener('touchend', pttUp, { passive: false });
transcriptDiv.addEventListener('click', function () { transcriptDiv.innerHTML = ''; transcriptDiv.style.display = 'none'; });
window.addEventListener('beforeunload', function () {
  if (isCallActive) {
    isCallActive = false;
    stopAudioCapture();
    stopPlayback();
    if (ws) ws.close();
  }
});
requestAnimationFrame(animationLoop);

// Controles de depuracion (Fase 0.4): ocultos por defecto; solo se muestran
// con ?debug=1. El servidor arbitrario y el test de TTS no son para el usuario.
if (new URLSearchParams(window.location.search).get('debug') === '1') {
  const dbg = document.getElementById('debugControls');
  if (dbg) dbg.classList.remove('hidden');
}

async function testTTS() {
  setStatus(STATUS.PROCESSING, 'Probando TTS...');
  try {
    const resp = await fetchConTimeout(getApiBase() + '/call/test_tts', { headers: authHeaders() }, 10000);
    if (!resp.ok) {
      const err = await resp.json().catch(function () { return { reason: resp.statusText }; });
      throw new Error(err.reason || 'HTTP ' + resp.status);
    }
    const blob = await resp.blob();
    log('TTS OK: ' + blob.size + ' bytes en ' + (resp.headers.get('X-TTS-Duration') || '?') + 's');
    await ensureAudioContext();
    const audioBuf = await audioContext.decodeAudioData(await blob.arrayBuffer());
    const source = audioContext.createBufferSource();
    source.buffer = audioBuf;
    source.connect(playbackGain);
    source.start(0);
    setStatus(STATUS.LISTENING, 'TTS funciona');
  } catch (e) {
    setStatus(STATUS.ERROR, 'TTS falló: ' + e.message);
  }
}
