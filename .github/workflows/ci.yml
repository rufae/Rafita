name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: ""

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install ruff mypy
          pip install -r agent/requirements.txt
      - name: Ruff lint
        run: ruff check agent/src --config pyproject.toml
      - name: Ruff format check
        run: ruff format --check agent/src --config pyproject.toml
      - name: Mypy type check
        run: mypy agent/src --config-file pyproject.toml --no-error-summary

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install -r dev-requirements.txt
      - name: Run tests
        run: PYTHONPATH="$PWD/agent/src" pytest agent/tests -v --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r agent/requirements.txt
        continue-on-error: true
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: rafita-agent-core:${{ github.sha }},rafita-agent-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
