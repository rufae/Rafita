version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"
    # 2026-10-06: actualizaciones que ROMPEN el CI y no son necesarias →
    # no se actualizan hasta que haga falta. Para permitirlas: quitar la
    # línea (o revisar a mano el cambio de API y ajustar el código).
    ignore:
      # 1.2.0 -> 1.8.0 cambia la firma de PiperConfig (rompe mypy: noise_w).
      - dependency-name: "piper-tts"
      # 1.55 -> 3.x salto de mayor incompatible con el código actual.
      - dependency-name: "openai"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
