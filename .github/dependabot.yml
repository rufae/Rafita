version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"
    # 2026-10-06: actualizaciones que ROMPEN el CI y no son necesarias →
    # no se actualizan hasta que haga falta. Para permitirlas: quitar la
    # línea (o revisar a mano el cambio de API y ajustar el código).
    ignore:
      # 1.2.0 -> 1.8.0 cambia la firma de PiperConfig (rompe mypy: noise_w).
      - dependency-name: "piper-tts"
      # 1.55 -> 1.109 (y 3.x) cambian tipos que ya no casan en
      # openai_compat.py (mypy union-attr) → se ignora hasta que haga
      # falta tocar el código para el nuevo SDK. Y como openai queda
      # fijado en 1.55 (que pasa `proxies=` a httpx), httpx >=0.28
      # rompe AsyncHttpxClientWrapper → también ignorado.
      - dependency-name: "openai"
      - dependency-name: "httpx"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
