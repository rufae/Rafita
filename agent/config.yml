vault:
  # Nombres de carpeta del vault por clave simbolica (tarea 2.1). Cambia solo
  # los valores para adaptar la instancia a tu propia estructura; los defaults
  # son PARA+Zettelkasten. `structure` e `ignored_dirs` son opcionales.
  folders:
    inbox: 00-Inbox
    projects: 01-Proyectos
    areas: 02-Areas
    areas_salud: 02-Areas/Salud
    areas_finanzas: 02-Areas/Finanzas
    areas_trabajo: 02-Areas/Trabajo
    areas_casa: 02-Areas/Casa
    agenda: 02-Areas/Agenda
    resources: 03-Recursos
    archive: 04-Archivo
    zettelkasten: 05-Zettelkasten
    diary: 06-Diario
    attachments: Attachments
    indexed_docs: 03-Recursos/Documentos_Indexados
  # Carpetas que BrainMaintainer nunca modifica/revierte automaticamente
  # (tarea 2.4). Si se omite, se usan finanzas, salud y diario.
  protected_folders:
    - 02-Areas/Finanzas
    - 02-Areas/Salud
    - 06-Diario

telegram:
  allowed_users: []
  admin_ids: []
ollama:
  model: gemma4:12b
  vision_model: llava:7b
  embedding_model: nomic-embed-text
  host: http://ollama:11434/v1
database:
  path: /data/db/rafita.db
logging:
  level: DEBUG
  path: /data/logs
storage:
  data_path: /data
  obsidian_vault: /data/obsidian_vault
voice:
  whisper_model: base
  voice_replies_default: false
finance:
  default_currency: MXN
rag:
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 3
google:
  credentials_dir: /workspace/credentials
