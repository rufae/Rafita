services:
  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    hostname: ollama
    restart: unless-stopped
    networks:
      - rafita-net
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama/models:/root/.ollama
    # GPU NVIDIA (RTX 3060, etc.): usa el overlay incluido; NO añadas otro
    # bloque `deploy:` aquí (este servicio ya tiene uno para memoria y dos
    # claves `deploy` en el mismo servicio producen YAML inválido):
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # Requiere NVIDIA Container Toolkit en el host (ver docs/MIGRATION.md).
    # Para AMD en Linux, crea un overlay equivalente con
    # `devices: ["/dev/dri:/dev/dri"]` en lugar de la reserva NVIDIA.
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_SCHED_SPREAD=true
      - OLLAMA_VULKAN=1
    deploy:
      resources:
        limits:
          memory: 7G
        reservations:
          memory: 5G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rafita-agent-core:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: rafita-agent-core
    hostname: rafita
    restart: unless-stopped
    networks:
      - rafita-net
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      ollama-service:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./agent/src:/app/src
      - ./mi_boveda_obsidian:/data/obsidian_vault
      - ./:/workspace
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATA_DIR=/data
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/ready', timeout=5); exit(0) if r.status_code==200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 7200s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    stdin_open: false
    tty: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rafita-net:
    name: rafita-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
