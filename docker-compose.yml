services:
  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    hostname: ollama
    restart: unless-stopped
    networks:
      - rafita-net
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama/models:/root/.ollama
    # Dispositivos GPU comentados: /dev/dri no disponible en WSL2
    # Descomentar tras instalar drivers AMD para WSL2:
    # https://www.amd.com/en/support/kb/release-notes/amdgpu-installation
    # devices:
    #   - /dev/dri:/dev/dri
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_SCHED_SPREAD=true
      - OLLAMA_VULKAN=1
    deploy:
      resources:
        limits:
          memory: 7G
        reservations:
          memory: 5G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  rafita-agent-core:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: rafita-agent-core
    hostname: rafita
    restart: unless-stopped
    networks:
      - rafita-net
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      ollama-service:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./agent/src:/app/src
      - ./mi_boveda_obsidian:/data/obsidian_vault
      - ./:/workspace
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATA_DIR=/data
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - WEBHOOK_SECRET=rafita-secure-2026
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/health', timeout=5); exit(0) if r.status_code==200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 7200s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    stdin_open: false
    tty: false

networks:
  rafita-net:
    name: rafita-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
