# Overlay de GPU NVIDIA para Ollama (RTX 3060, etc.).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requisitos en el host:
#   - Drivers NVIDIA funcionando (`nvidia-smi` en el host).
#   - NVIDIA Container Toolkit instalado y Docker configurado
#     (ver MIGRATION.md -> "Habilitar soporte GPU en Docker").
#
# Este overlay añade la reserva de dispositivo al ÚNICO bloque `deploy` de
# ollama-service. No copies estas líneas al docker-compose.yml base: un segundo
# `deploy:` en el mismo servicio produce YAML inválido.
services:
  ollama-service:
    environment:
      - OLLAMA_VULKAN=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
